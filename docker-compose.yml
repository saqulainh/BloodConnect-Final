# ═══════════════════════════════════════════════════════════════════════
# BloodConnect — Docker Compose Orchestrator
# One command to rule them all: docker-compose up --build
# ═══════════════════════════════════════════════════════════════════════
#
# Architecture:
#   ┌─────────────┐     ┌────────────────┐     ┌─────────────────┐
#   │  frontend   │────▶│   api (x3)     │────▶│   MongoDB Atlas │
#   │  (Nginx)    │     │  Express API   │     │   (Cloud DB)    │
#   │  Port: 80   │     │  Port: 5000    │     └─────────────────┘
#   └─────────────┘     └────────────────┘              ▲
#                       ┌────────────────┐              │
#                       │    worker      │──────────────┘
#                       │  Cron Jobs     │
#                       │  (Isolated)    │
#                       └────────────────┘
#
# ═══════════════════════════════════════════════════════════════════════

services:
  # ─── Backend API Server (Scalable Replicas) ─────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    ports:
      - "5000:5000"
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bloodconnect-net

  # ─── Background Worker Microservice (Isolated Cron Jobs) ────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - bloodconnect-net

  # ─── Frontend (Nginx Static + Reverse Proxy) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_PUSHER_KEY: ${VITE_PUSHER_KEY:-}
        VITE_PUSHER_CLUSTER: ${VITE_PUSHER_CLUSTER:-}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - bloodconnect-net

networks:
  bloodconnect-net:
    driver: bridge
